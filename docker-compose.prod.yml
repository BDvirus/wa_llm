services:
  postgres:
    extends:
      file: docker-compose.base.yml
      service: postgres
    restart: always
    # Stack-unique aliases on the internal network. The shared proxy network
    # may hold other stacks' `postgres`/`whatsapp`/`web-server`, and Docker DNS
    # would then resolve the generic names to the wrong container.
    networks:
      default:
        aliases: [wa-llm-postgres]

  whatsapp:
    extends:
      file: docker-compose.base.yml
      service: whatsapp
    environment:
      - WHATSAPP_WEBHOOK=http://wa-llm-web:8000/webhook
      - DB_URI=postgres://user:password@wa-llm-postgres:5432/webhook_db?sslmode=disable
    restart: always
    networks:
      default:
        aliases: [wa-llm-gowa]
      proxy: {}
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-proxy}
      - traefik.http.routers.gowa.rule=Host(`${GOWA_HOST:?set GOWA_HOST}`)
      - traefik.http.routers.gowa.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.gowa.tls=true
      # TEMP (testing): Authentik disabled - re-enable before real use.
      # - traefik.http.routers.gowa.middlewares=${AUTHENTIK_MIDDLEWARE:-authentik@docker}
      - traefik.http.services.gowa.loadbalancer.server.port=3000

  web-server:
    #image: ghcr.io/ilanbenb/wa_llm:1.4.10
    image: ghcr.io/bdvirus/wa_llm:main
    env_file:
      - .env.prod
    # No published port: the admin UI and API are reached through Traefik,
    # behind Authentik. gowa still reaches /webhook on the default network.
    networks:
      default:
        aliases: [wa-llm-web]
      proxy: {}
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-proxy}
      - traefik.http.routers.wa-llm.rule=Host(`${WA_LLM_HOST:?set WA_LLM_HOST}`)
      - traefik.http.routers.wa-llm.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.wa-llm.tls=true
      # TEMP (testing): Authentik disabled - re-enable before real use.
      # - traefik.http.routers.wa-llm.middlewares=${AUTHENTIK_MIDDLEWARE:-authentik@docker}
      - traefik.http.services.wa-llm.loadbalancer.server.port=8000
    depends_on:
      postgres:
        condition: service_healthy
      whatsapp:
        condition: service_started
    environment:
      - PORT=8000
      - DB_URI=postgresql+asyncpg://user:password@wa-llm-postgres:5432/postgres
      - WHATSAPP_HOST=http://wa-llm-gowa:3000
      # Trust X-Forwarded-Proto from Traefik so generated URLs stay https.
      # Set to Traefik's IP or subnet to narrow it; * trusts any peer on the network.
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS:-*}
    restart: always

networks:
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-proxy}

volumes:
  wa_llm_whatsapp:
    name: wa_llm_whatsapp
  wa_llm_whatsapp_statics:
    name: wa_llm_whatsapp_statics    
  wa_llm_postgres:
    name: wa_llm_postgres